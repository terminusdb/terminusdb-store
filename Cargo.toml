[package]
name = "terminus-store"
version = "0.21.5"
authors = ["Matthijs van Otterdijk <matthijs@datachemist.com>"]
edition = "2018"
license = "Apache-2.0"
description = "a triple store library"
homepage = "https://terminusdb.com"
repository = "https://github.com/terminusdb/terminusdb-store"
documentation = "https://docs.rs/terminus-store/"
exclude = [".gitignore", ".github/", "/ci/"]

[dependencies]
byteorder = "1.4"
futures = "0.3"
futures-locks = "0.7"
tokio = {version = "1.0", features = ["full", "test-util"]}
tokio-util = {version = "0.7.17", features = ["codec"]}
bytes = "1.0"
rand = "0.9.2"
lazy_static = "1.4"
fs2 = "0.4.3"
tar = "0.4"
flate2 = "1.0"
rayon = "1.7"
thiserror = "2.0.17"
async-trait = "0.1"
itertools = "0.14.0"
rug = {version="1.16", default-features=false, features=["integer","rational"]}
num-derive = "0.4"
num-traits = "0.2"
chrono = "0.4"
base64 = "0.22.1"
hex = "0.4"
regex = "1.5"
lru = "0.16.2"
bitvec = "1.0"
tempfile = "3.1"
dashmap = "6.1.0"
tdb-succinct = "0.1.2"

[features]
noreadlock = []
eprint_log = []
